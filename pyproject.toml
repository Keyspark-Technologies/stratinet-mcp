[project]
name = "stratinet-mcp"
version = "0.1.0"
description = "Public MCP server: advisory exposure and network troubleshooting."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.2.0",
    "ntc-templates",
    "psycopg[binary]",
    "pyyaml",
    "starlette",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "engines/cve/rule_loader.py",
    "engines/cve/version_match.py",
    "engines/cve/cve_authority.py",
    "engines/triage/extract.py",
    "engines/triage/findings.py",
    "engines/triage/select.py",
    "engines/triage/signals.py",
    "engines/triage/triage.py",
    "engines/triage/triage_readonly.py",
    "engines/cve/grounding.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"server/main.py" = ["S104"]
"tests/**" = ["S101", "S310", "S603"]
